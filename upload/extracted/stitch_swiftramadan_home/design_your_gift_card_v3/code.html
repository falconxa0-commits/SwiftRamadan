<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Design Your Gift Card V3</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ecb613",
                        "background-light": "#f8f8f6",
                        "background-dark": "#121212",
                        "accent-dark": "#221d10",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .custom-radio-dot {
            --radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(236,182,19)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%273%27/%3e%3c/svg%3e');
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white transition-colors duration-300">
<!-- Top Navigation Bar -->
<div class="fixed top-0 left-0 right-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-200 dark:border-accent-dark">
<div class="flex items-center justify-between p-4 max-w-md mx-auto">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-accent-dark">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold tracking-tight">Design Your Gift Card</h2>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-accent-dark">
<span class="material-symbols-outlined text-2xl">info</span>
</button>
</div>
<!-- Progress Indicator -->
<div class="flex w-full h-1 bg-gray-200 dark:bg-accent-dark">
<div class="w-1/3 h-full bg-primary shadow-[0_0_8px_rgba(236,182,19,0.5)]"></div>
</div>
</div>
<main class="pt-20 pb-32 max-w-md mx-auto min-h-screen">
<!-- Step Indicator -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-6">
<div class="h-1.5 w-6 rounded-full bg-primary"></div>
<div class="h-1.5 w-2 rounded-full bg-gray-300 dark:bg-accent-dark"></div>
<div class="h-1.5 w-2 rounded-full bg-gray-300 dark:bg-accent-dark"></div>
</div>
<!-- Live Preview Card -->
<div class="px-4 mb-8">
<div class="relative w-full aspect-[1.6/1] rounded-xl overflow-hidden shadow-2xl ring-1 ring-primary/20">
<div class="absolute inset-0 bg-gradient-to-br from-[#1a1a1a] via-[#2a2416] to-[#121212]" data-alt="Dark elegant marble texture background"></div>
<!-- Card Decorative Pattern -->
<div class="absolute inset-0 opacity-20" data-alt="Gold dot pattern overlay" style="background-image: radial-gradient(circle at 2px 2px, #ecb613 1px, transparent 0); background-size: 24px 24px;"></div>
<div class="relative h-full w-full p-6 flex flex-col justify-between items-center text-center">
<div class="w-12 h-12 border border-primary/40 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">star_half</span>
</div>
<p class="text-primary text-lg font-medium italic px-4 leading-relaxed">
                        "May this Ramadan bring peace and prosperity to your home."
                    </p>
<div class="w-full flex justify-between items-end border-t border-primary/20 pt-4">
<span class="text-xs tracking-widest uppercase opacity-60">Ramadan 2026</span>
<span class="text-primary font-bold">₦ 50,000</span>
</div>
</div>
</div>
</div>
<!-- Section 1: Blessing Selection -->
<section class="mb-10">
<h2 class="text-xl font-bold px-4 mb-4 tracking-tight flex items-center gap-2">
<span class="text-primary">01.</span> Choose a Blessing
            </h2>
<div class="flex flex-col gap-3 px-4 custom-radio-dot">
<label class="flex items-center gap-4 rounded-xl border border-solid border-gray-200 dark:border-accent-dark bg-white/50 dark:bg-accent-dark/30 p-4 transition-all hover:border-primary/50 cursor-pointer">
<input checked="" class="h-5 w-5 border-2 border-gray-300 dark:border-gray-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0" name="blessing" type="radio"/>
<div class="flex grow flex-col">
<p class="text-sm font-medium leading-normal italic">May this Ramadan bring peace and prosperity to your home.</p>
<p class="text-xs opacity-50 mt-1 uppercase tracking-wider">Classic Grace</p>
</div>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-gray-200 dark:border-accent-dark bg-white/50 dark:bg-accent-dark/30 p-4 transition-all hover:border-primary/50 cursor-pointer">
<input class="h-5 w-5 border-2 border-gray-300 dark:border-gray-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0" name="blessing" type="radio"/>
<div class="flex grow flex-col">
<p class="text-sm font-medium leading-normal italic">Wishing you a month filled with mercy and light.</p>
<p class="text-xs opacity-50 mt-1 uppercase tracking-wider">Spiritual Radiance</p>
</div>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-gray-200 dark:border-accent-dark bg-white/50 dark:bg-accent-dark/30 p-4 transition-all hover:border-primary/50 cursor-pointer">
<input class="h-5 w-5 border-2 border-gray-300 dark:border-gray-600 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0" name="blessing" type="radio"/>
<div class="flex grow flex-col">
<p class="text-sm font-medium leading-normal italic">May your fasts and prayers be accepted in this holy season.</p>
<p class="text-xs opacity-50 mt-1 uppercase tracking-wider">Humble Prayer</p>
</div>
</label>
</div>
</section>
<!-- Section 2: Aesthetic Selection -->
<section class="mb-10">
<h2 class="text-xl font-bold px-4 mb-4 tracking-tight flex items-center gap-2">
<span class="text-primary">02.</span> Select Aesthetic
            </h2>
<div class="flex overflow-x-auto gap-4 px-4 hide-scrollbar">
<!-- Aesthetic Item -->
<div class="flex-none w-24">
<div class="h-24 w-24 rounded-lg bg-gradient-to-br from-[#1a1a1a] to-[#221d10] ring-2 ring-primary p-1 mb-2">
<div class="w-full h-full rounded-md border border-primary/30 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">check_circle</span>
</div>
</div>
<p class="text-[10px] text-center uppercase tracking-widest font-bold">Midnight</p>
</div>
<div class="flex-none w-24 opacity-60">
<div class="h-24 w-24 rounded-lg bg-gradient-to-tr from-gray-100 to-white ring-1 ring-gray-200 mb-2">
<div class="w-full h-full rounded-md flex items-center justify-center overflow-hidden">
<div class="w-full h-full bg-slate-200/50" data-alt="White marble texture pattern"></div>
</div>
</div>
<p class="text-[10px] text-center uppercase tracking-widest font-bold">Marble</p>
</div>
<div class="flex-none w-24 opacity-60">
<div class="h-24 w-24 rounded-lg bg-primary ring-1 ring-primary/20 mb-2">
<div class="w-full h-full rounded-md flex items-center justify-center overflow-hidden">
<div class="w-full h-full bg-primary/80" data-alt="Gold silk texture pattern"></div>
</div>
</div>
<p class="text-[10px] text-center uppercase tracking-widest font-bold">Royal Silk</p>
</div>
<div class="flex-none w-24 opacity-60">
<div class="h-24 w-24 rounded-lg bg-[#2d3436] ring-1 ring-gray-200 mb-2">
<div class="w-full h-full rounded-md flex items-center justify-center overflow-hidden">
<div class="w-full h-full bg-zinc-800" data-alt="Charcoal paper texture pattern"></div>
</div>
</div>
<p class="text-[10px] text-center uppercase tracking-widest font-bold">Charcoal</p>
</div>
</div>
</section>
<!-- Section 3: Amount Selection -->
<section class="mb-10">
<h2 class="text-xl font-bold px-4 mb-4 tracking-tight flex items-center gap-2">
<span class="text-primary">03.</span> Assign Value
            </h2>
<div class="px-4">
<div class="relative mb-6">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl font-bold text-primary">₦</span>
<input class="w-full bg-white dark:bg-accent-dark border-2 border-gray-200 dark:border-accent-dark focus:border-primary dark:focus:border-primary rounded-xl py-4 pl-12 pr-4 text-2xl font-bold tracking-tight outline-none transition-colors" type="number" value="50000"/>
</div>
<div class="grid grid-cols-3 gap-3">
<button class="py-3 px-2 rounded-lg border border-primary/30 text-primary font-bold text-sm bg-primary/10 hover:bg-primary/20 transition-colors">₦ 25,000</button>
<button class="py-3 px-2 rounded-lg border-2 border-primary text-white font-bold text-sm bg-primary transition-colors">₦ 50,000</button>
<button class="py-3 px-2 rounded-lg border border-primary/30 text-primary font-bold text-sm bg-primary/10 hover:bg-primary/20 transition-colors">₦ 100,000</button>
</div>
</div>
</section>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-gray-200 dark:border-accent-dark">
<div class="max-w-md mx-auto flex items-center gap-4">
<div class="flex-1">
<p class="text-[10px] uppercase tracking-widest opacity-60 font-bold mb-0.5">Total Amount</p>
<p class="text-2xl font-bold tracking-tight">₦ 50,000</p>
</div>
<button class="flex-[1.5] bg-primary text-black font-bold h-14 rounded-xl shadow-[0_4px_20px_rgba(236,182,19,0.3)] flex items-center justify-center gap-2 hover:scale-[1.02] active:scale-[0.98] transition-all">
                Continue to Gifting
                <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
</div>
</div>
</body></html>

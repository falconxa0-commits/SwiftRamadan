<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Iftar Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4c025",
                        "background-light": "#f8f8f5",
                        "background-dark": "#1a170e",
                        "success-green": "#22c55e",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .map-overlay {
            background: linear-gradient(180deg, rgba(26, 23, 14, 0.8) 0%, rgba(26, 23, 14, 0) 20%, rgba(26, 23, 14, 0) 80%, rgba(26, 23, 14, 1) 100%);
        }
        .golden-path {
            filter: drop-shadow(0 0 8px rgba(244, 192, 37, 0.6));
        }
        .pulse-green {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden h-screen flex flex-col">
<!-- Top Navigation Bar -->
<div class="relative z-20 flex items-center bg-transparent p-4 pb-2 justify-between">
<div class="flex size-12 shrink-0 items-center justify-center rounded-full bg-background-dark/40 backdrop-blur-md">
<span class="material-symbols-outlined text-white">arrow_back_ios_new</span>
</div>
<div class="flex flex-col items-center">
<h2 class="text-white text-lg font-bold leading-tight tracking-tight">Live Iftar Tracking</h2>
<p class="text-primary text-xs font-medium uppercase tracking-widest">Maghrib in 12:40</p>
</div>
<div class="flex w-12 items-center justify-end">
<button class="flex size-12 cursor-pointer items-center justify-center rounded-full bg-background-dark/40 backdrop-blur-md text-white">
<span class="material-symbols-outlined">share</span>
</button>
</div>
</div>
<!-- Full Screen Map Area -->
<div class="fixed inset-0 z-0 h-full w-full">
<!-- Mock 3D Map Background -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="Dark themed 3D architectural map of Lagos city at night" data-location="Lagos, Nigeria" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBHBdKqmXztPaBO3GlmtOqu4etombK1XU6rpYrGFo7Pj3rkTxI7hbM-LOXIJg8VHJChgrX-uyLq-s0vI7K3IrNfF_Q24L2x4LqCebpdPiQ-C3HNHKrNg90AlLxt1bhqQ0qUXDeQin2x3jdRScJR0Ev-BaWrkEgiG6uguvKqBKyDrVgiWrg42Y5c6_zLfi0-aNx5i42jUdIu9shNgwEJNAzHfDffilveUVFd6kRvUY8QUJ2pDu9vfIfC59AZdqkcbPjIGQWurXdkukyy");'>
<div class="absolute inset-0 bg-black/60"></div>
<!-- Map Overlay Gradients -->
<div class="absolute inset-0 map-overlay"></div>
<!-- Route Path (The Golden Path) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 400 800">
<path class="golden-path" d="M100,600 Q150,500 250,450 T300,200" fill="none" stroke="#f4c025" stroke-dasharray="8 8" stroke-linecap="round" stroke-width="4"></path>
<!-- Destination Marker -->
<circle class="pulse-green" cx="300" cy="200" fill="#22c55e" r="8"></circle>
<text class="drop-shadow-lg" fill="white" font-size="12" font-weight="bold" x="290" y="180">Home</text>
<!-- Rider Marker (Musa) -->
<g transform="translate(130, 540)">
<circle fill="#f4c025" fill-opacity="0.2" r="22"></circle>
<circle fill="#f4c025" r="16"></circle>
<text fill="black" font-family="Material Symbols Outlined" font-size="20" x="-10" y="5">moped</text>
</g>
</svg>
</div>
<!-- Floating Map Controls -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-3 z-10">
<div class="flex flex-col gap-1 overflow-hidden rounded-xl border border-white/10 shadow-2xl">
<button class="flex size-12 items-center justify-center bg-background-dark/80 backdrop-blur-xl text-white hover:bg-primary/20">
<span class="material-symbols-outlined">add</span>
</button>
<div class="h-[1px] bg-white/10"></div>
<button class="flex size-12 items-center justify-center bg-background-dark/80 backdrop-blur-xl text-white hover:bg-primary/20">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
<button class="flex size-12 items-center justify-center rounded-xl bg-background-dark/80 backdrop-blur-xl text-primary shadow-2xl border border-white/10">
<span class="material-symbols-outlined">near_me</span>
</button>
</div>
</div>
<!-- Search/Address Bar (Floating) -->
<div class="relative z-10 px-4 mt-2">
<label class="flex flex-col w-full h-14">
<div class="flex w-full flex-1 items-stretch rounded-full bg-background-dark/80 backdrop-blur-xl border border-white/10 shadow-2xl">
<div class="text-primary flex items-center justify-center pl-5">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 border-none bg-transparent text-white focus:outline-0 focus:ring-0 px-4 text-base font-normal placeholder:text-gray-400" placeholder="Search delivery location" value="12 Victoria Island, Lagos"/>
</div>
</label>
</div>
<!-- Content Spacer -->
<div class="flex-1"></div>
<!-- Bottom Tracking Card (Bottom Sheet) -->
<div class="relative z-30 w-full px-4 pb-8">
<div class="flex flex-col items-stretch bg-background-dark/90 backdrop-blur-2xl rounded-xl border border-white/5 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] overflow-hidden">
<!-- Handle -->
<div class="flex h-6 w-full items-center justify-center">
<div class="h-1.5 w-12 rounded-full bg-white/20"></div>
</div>
<!-- Arrival Status Header -->
<div class="px-6 pb-4">
<div class="flex items-start justify-between">
<div>
<p class="text-white text-2xl font-bold leading-tight tracking-tight">Arriving in 8 mins</p>
<div class="flex items-center gap-2 mt-1">
<span class="flex h-2 w-2 rounded-full bg-success-green"></span>
<p class="text-success-green text-sm font-semibold tracking-wide uppercase">Ready for Iftar</p>
</div>
</div>
<div class="bg-primary/10 px-3 py-1 rounded-full">
<p class="text-primary text-xs font-bold uppercase tracking-widest">Order #2026</p>
</div>
</div>
</div>
<div class="h-[1px] bg-white/5 mx-6"></div>
<!-- Rider Details Section -->
<div class="flex items-center gap-4 px-6 py-5">
<div class="relative">
<div class="h-16 w-16 rounded-full border-2 border-primary p-0.5">
<div class="h-full w-full rounded-full bg-cover bg-center" data-alt="Rider Musa portrait smiling profile photo" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCNc8YuWmnnbiry5oZB4taWr_fVeHxCBHY30KvEjdPXuyPSlj5mlmq05qT3jJILU0yHIaCc64DODNdUuURIDzHOFSBj5c6cBRqmhbMtMg495qGCqm9c-TTWWBOGF8L7gKjvs-CuEW2BQmFmH1t33uWoe0yBhCJC7tYhykvWcdW9t_dTQym9PrQ03rPmEZdaVz_K6N53pDhrnQetcrVyYvoIPD3yx5-q0R6KIIbPRWNZk0rDFr4zrUZ-Ca2ibA6a_BosbJBqa6JHCgsm");'></div>
</div>
<div class="absolute -bottom-1 -right-1 bg-primary text-black text-[10px] font-extrabold px-1.5 py-0.5 rounded-full border-2 border-background-dark">
                        4.9 ★
                    </div>
</div>
<div class="flex-1 flex flex-col justify-center">
<p class="text-white text-lg font-bold leading-tight">Musa</p>
<p class="text-gray-400 text-sm font-normal">Electric Bike • Golden Route Delivery</p>
</div>
<div class="flex gap-2">
<button class="flex size-12 cursor-pointer items-center justify-center rounded-full bg-white/5 text-white border border-white/10 hover:bg-white/10">
<span class="material-symbols-outlined">chat_bubble</span>
</button>
<button class="flex h-12 px-6 cursor-pointer items-center justify-center rounded-full bg-primary text-black gap-2 font-bold transition-transform active:scale-95 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-[20px]">call</span>
<span>Call Rider</span>
</button>
</div>
</div>
<!-- Quick Status Ticker -->
<div class="bg-white/5 px-6 py-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-400">restaurant_menu</span>
<p class="text-gray-300 text-sm italic">"Warm Jollof &amp; Dates Pack" being carefully handled</p>
</div>
<span class="material-symbols-outlined text-gray-500 text-sm">info</span>
</div>
</div>
</div>
<!-- Safe Area Bottom (iPhone) -->
<div class="h-4 bg-background-dark"></div>
</body></html>

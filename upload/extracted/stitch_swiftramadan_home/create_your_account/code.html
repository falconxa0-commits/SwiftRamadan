<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SwiftRamadan - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2b90d",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221e10",
                        "surface-dark": "#342d18",
                        "border-dark": "#685a31"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .ios-scroll-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white transition-colors duration-300">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl">
<!-- Top Navigation -->
<div class="flex items-center p-4 pb-2 justify-between">
<div aria-label="Go Back" class="text-white flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">SwiftRamadan</h2>
</div>
<!-- Progress Section -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between">
<p class="text-white text-base font-medium leading-normal">Create Your Account</p>
<p class="text-white/60 text-sm font-normal leading-normal">Step 1 of 3</p>
</div>
<div class="rounded-full bg-border-dark overflow-hidden h-2">
<div class="h-full rounded-full bg-primary" style="width: 33.3%;"></div>
</div>
</div>
<!-- Main Form Container -->
<div class="flex-1 overflow-y-auto ios-scroll-hide px-4 pt-4 pb-12">
<h1 class="text-white tracking-light text-[32px] font-bold leading-tight pb-6">Join our Ramadan community</h1>
<form class="flex flex-col gap-5">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="text-white text-sm font-medium leading-normal ml-1">Full Name</label>
<input class="w-full rounded-xl text-white border border-border-dark bg-surface-dark focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-white/30 p-4 text-base transition-all" placeholder="e.g., Olumide Adebayo" type="text"/>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-2">
<label class="text-white text-sm font-medium leading-normal ml-1">Phone Number</label>
<div class="relative">
<input class="w-full rounded-xl text-white border border-border-dark bg-surface-dark focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-white/30 pl-14 text-base transition-all" placeholder="812 345 6789" type="tel"/>
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-medium border-r border-border-dark pr-2">+234</span>
</div>
</div>
<!-- Email Address Field -->
<div class="flex flex-col gap-2">
<label class="text-white text-sm font-medium leading-normal ml-1">Email Address</label>
<input class="w-full rounded-xl text-white border border-border-dark bg-surface-dark focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-white/30 p-4 text-base transition-all" placeholder="name@example.com" type="email"/>
</div>
<!-- Residential Area Dropdown -->
<div class="flex flex-col gap-2">
<label class="text-white text-sm font-medium leading-normal ml-1">Residential Area</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl text-white border border-border-dark bg-surface-dark focus:border-primary focus:ring-1 focus:ring-primary h-14 p-4 text-base transition-all">
<option disabled="" selected="" value="">Select your city</option>
<option value="lagos">Lagos (Ikeja, Lekki, Victoria Island)</option>
<option value="abuja">Abuja (Maitama, Garki, Wuse)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none">expand_more</span>
</div>
</div>
<!-- Community Join Checkbox -->
<div class="flex items-start gap-3 mt-2 p-4 rounded-xl bg-primary/10 border border-primary/20">
<div class="flex items-center h-6">
<input class="h-5 w-5 rounded border-primary bg-surface-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="community" type="checkbox"/>
</div>
<label class="flex flex-col" for="community">
<span class="text-white text-sm font-semibold">Join neighborhood Group Buy community</span>
<span class="text-white/60 text-xs">Save up to 20% on bulk Iftar supplies with neighbors.</span>
</label>
</div>
</form>
</div>
<!-- Footer / Action Area -->
<div class="p-4 bg-background-dark/80 backdrop-blur-md border-t border-border-dark/30">
<button class="w-full h-14 bg-primary text-background-dark font-bold text-lg rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                Create Account
                <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
<div class="mt-4 flex flex-col items-center gap-4">
<p class="text-white/60 text-sm">
                    Already have an account? <span class="text-primary font-bold cursor-pointer hover:underline">Log in</span>
</p>
<!-- Trust Badge -->
<div class="flex items-center gap-2 py-1 px-3 rounded-full bg-white/5 border border-white/10">
<span class="material-symbols-outlined text-[14px] text-primary">verified_user</span>
<span class="text-[10px] uppercase tracking-widest font-bold text-white/50">Halal Certified Logistics</span>
</div>
</div>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 opacity-5 pointer-events-none overflow-hidden">
<div class="absolute top-20 -right-20 w-64 h-64 rounded-full border-[1px] border-primary"></div>
<div class="absolute -bottom-10 -left-10 w-48 h-48 rounded-full border-[1px] border-primary/50"></div>
<div class="absolute top-[30%] left-[10%] opacity-20 rotate-45">
<span class="material-symbols-outlined text-[120px] text-primary">filter_vintage</span>
</div>
</div>
</body></html>

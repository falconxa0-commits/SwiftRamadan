<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OTP Verification</title>
<!-- Tailwind CSS with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2b90d",
                        "accent-green": "#1E4D2B",
                        "background-light": "#f8f8f5",
                        "background-dark": "#121212",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom styles for the OTP inputs to ensure they look premium */
        .otp-input:focus {
            border-bottom: 2px solid #f2b90d !important;
            color: #f2b90d;
        }
        /* Hide spin buttons for numeric inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col items-center">
<!-- Top Navigation Bar -->
<nav class="w-full max-w-md flex items-center justify-between p-4 bg-background-light dark:bg-background-dark">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-1">
<div class="size-2 rounded-full bg-primary/30"></div>
<div class="size-2 rounded-full bg-primary"></div>
<div class="size-2 rounded-full bg-primary/30"></div>
</div>
<div class="size-10"></div> <!-- Placeholder for symmetry -->
</nav>
<!-- Main Content Container -->
<main class="w-full max-w-md flex flex-col px-6 pt-8 pb-10 flex-1">
<!-- Headline Section -->
<header class="mb-10">
<h1 class="text-[32px] font-bold leading-tight tracking-tight mb-3">Verify Your Number</h1>
<p class="text-slate-500 dark:text-slate-400 text-base leading-relaxed">
                We've sent a 4-digit verification code to your mobile number.
            </p>
</header>
<!-- Phone Number / Edit Section (ListItem modified) -->
<section class="flex items-center gap-4 bg-white/5 dark:bg-white/5 border border-slate-200 dark:border-white/10 p-4 rounded-xl mb-10">
<div class="flex size-10 items-center justify-center rounded-full bg-accent-green/20 text-accent-green dark:text-[#2ECC71]">
<span class="material-symbols-outlined">call</span>
</div>
<div class="flex-1">
<p class="text-xs text-slate-500 dark:text-slate-400 font-medium uppercase tracking-wider">Phone Number</p>
<p class="text-lg font-semibold tracking-wide">+234 803 ••• ••••</p>
</div>
<button class="flex items-center justify-center px-4 py-1.5 rounded-lg bg-primary/10 text-primary text-sm font-bold border border-primary/20 hover:bg-primary/20 transition-all">
                Edit
            </button>
</section>
<!-- OTP Input Section (ConfirmationCode modified for 4 digits) -->
<section class="mb-10">
<div class="flex justify-between items-center px-2 max-w-[280px] mx-auto">
<fieldset class="flex gap-4 w-full justify-between">
<input autofocus="" class="otp-input flex h-16 w-14 text-center text-2xl font-bold bg-transparent border-0 border-b-2 border-slate-300 dark:border-white/20 focus:outline-0 focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input flex h-16 w-14 text-center text-2xl font-bold bg-transparent border-0 border-b-2 border-slate-300 dark:border-white/20 focus:outline-0 focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input flex h-16 w-14 text-center text-2xl font-bold bg-transparent border-0 border-b-2 border-slate-300 dark:border-white/20 focus:outline-0 focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input flex h-16 w-14 text-center text-2xl font-bold bg-transparent border-0 border-b-2 border-slate-300 dark:border-white/20 focus:outline-0 focus:ring-0 transition-all" maxlength="1" type="number"/>
</fieldset>
</div>
</section>
<!-- Countdown Timer Section -->
<section class="mb-12">
<div class="flex flex-col items-center gap-4">
<p class="text-sm text-slate-500 dark:text-slate-400">Didn't receive the code?</p>
<div class="flex gap-3">
<div class="flex flex-col items-center">
<div class="flex h-12 w-14 items-center justify-center rounded-lg bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10">
<p class="text-primary text-lg font-bold">00</p>
</div>
<p class="text-[10px] uppercase font-bold text-slate-400 mt-1">Min</p>
</div>
<div class="flex flex-col items-center">
<div class="flex h-12 w-14 items-center justify-center rounded-lg bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10">
<p class="text-primary text-lg font-bold">55</p>
</div>
<p class="text-[10px] uppercase font-bold text-slate-400 mt-1">Sec</p>
</div>
</div>
<button class="mt-2 text-primary font-semibold text-sm opacity-50 cursor-not-allowed">
                    Resend Code
                </button>
</div>
</section>
<!-- Action Button -->
<footer class="mt-auto">
<button class="w-full flex h-14 items-center justify-center rounded-xl bg-primary text-background-dark text-lg font-bold shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                Verify &amp; Continue
            </button>
<!-- Subtle Ramadan Theme Accent -->
<div class="flex justify-center mt-8 opacity-20 dark:opacity-10 pointer-events-none select-none">
<span class="material-symbols-outlined text-4xl">star_border_purple500</span>
<span class="material-symbols-outlined text-5xl mx-2">shield_moon</span>
<span class="material-symbols-outlined text-4xl">star_border_purple500</span>
</div>
</footer>
</main>
<!-- Background Pattern Decoration (Subtle premium feel) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-30">
<div class="absolute -top-[10%] -right-[10%] w-[60%] h-[40%] bg-primary/10 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-[10%] -left-[10%] w-[60%] h-[40%] bg-accent-green/10 blur-[100px] rounded-full"></div>
</div>
</body></html>

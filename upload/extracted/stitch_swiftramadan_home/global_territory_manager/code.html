<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Global Territory Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2b90d",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221e10",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(34, 30, 16, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(242, 185, 13, 0.1);
        }
        .hub-glow {
            box-shadow: 0 0 15px rgba(242, 185, 13, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-white font-display overflow-x-hidden">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between z-20">
<div class="text-primary flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined text-3xl">public</span>
</div>
<div class="flex-1">
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Territory Manager</h2>
<div class="flex items-center gap-1">
<span class="size-2 rounded-full bg-green-500 animate-pulse"></span>
<p class="text-[10px] uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold">Ramadan Operations Live</p>
</div>
</div>
<div class="flex w-12 items-center justify-end">
<button class="flex size-10 items-center justify-center rounded-lg bg-gray-100 dark:bg-[#342d18] text-gray-900 dark:text-white">
<span class="material-symbols-outlined">notifications</span>
</button>
</div>
</div>
<!-- Chips / Territory Selector -->
<div class="flex gap-3 p-3 overflow-x-auto no-scrollbar z-20 bg-background-light dark:bg-background-dark/50">
<div class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary pl-4 pr-4 shadow-lg shadow-primary/20">
<p class="text-background-dark text-sm font-bold leading-normal">All Hubs</p>
</div>
<div class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-gray-200 dark:bg-[#493f22] pl-4 pr-4">
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal">Lagos</p>
</div>
<div class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-gray-200 dark:bg-[#493f22] pl-4 pr-4">
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal">Abuja</p>
</div>
<div class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-gray-200 dark:bg-[#493f22] pl-4 pr-4">
<p class="text-gray-700 dark:text-white text-sm font-medium leading-normal">Kano</p>
</div>
</div>
<!-- Main Map View -->
<div class="relative flex-1 @container overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Dark stylized logistics map of Nigeria with hub markers" data-location="Nigeria" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDaQnvhWuAMFV2MfHGbDSY3ff8fJuPawZ2M6AF3xtZF-MbGxRWT8CBNC8y24eS9ARt_rGYDpJqoICc9o2Es4t-5kVAeDXXde0Hh1dfiNOBAgPvh_JBNEPtfLJlPcE4SAWXACpUc4kElLbgHVAOtHOWmith3t0QL7ywjUBOBGiswOJwsAxD6VIDv1x3GSfagT36JilnO1oI8q8ixYGm-Cgi1gFyH9Lu7CdsFzV0MagR6fZVntMEaLDLqRuNXMathPkG_sioh_DUFbs_A"); filter: grayscale(100%) brightness(30%) contrast(120%);'>
</div>
<!-- Map Overlay UI Elements -->
<div class="relative h-full w-full p-4 flex flex-col justify-between">
<!-- Search Bar -->
<div class="w-full">
<label class="flex flex-col min-w-40 h-12">
<div class="flex w-full flex-1 items-stretch rounded-xl h-full shadow-2xl">
<div class="text-primary flex border-none bg-white/10 backdrop-blur-md items-center justify-center pl-4 rounded-l-xl">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-xl text-white focus:outline-0 focus:ring-0 border-none bg-white/10 backdrop-blur-md h-full placeholder:text-gray-400 px-4 pl-2 text-base font-normal" placeholder="Search logistics hubs..."/>
</div>
</label>
</div>
<!-- Hub Visual Markers (Abstract) -->
<div class="absolute top-[60%] left-[20%]">
<div class="relative flex items-center justify-center">
<div class="absolute size-12 rounded-full bg-primary/20 animate-ping"></div>
<div class="size-6 rounded-full bg-primary border-4 border-background-dark hub-glow"></div>
<div class="absolute top-8 bg-background-dark/80 backdrop-blur px-2 py-1 rounded border border-primary/30">
<p class="text-[10px] font-bold">LAGOS</p>
</div>
</div>
</div>
<div class="absolute top-[40%] left-[55%]">
<div class="relative flex items-center justify-center">
<div class="size-5 rounded-full bg-primary/60 border-2 border-background-dark"></div>
<div class="absolute top-7 bg-background-dark/80 backdrop-blur px-2 py-1 rounded border border-white/10">
<p class="text-[10px] font-bold">ABUJA</p>
</div>
</div>
</div>
<!-- Map Controls -->
<div class="flex flex-col items-end gap-3 mb-4">
<div class="flex flex-col gap-1">
<button class="flex size-11 items-center justify-center rounded-xl bg-background-dark/80 backdrop-blur border border-white/10 text-white shadow-xl">
<span class="material-symbols-outlined">add</span>
</button>
<button class="flex size-11 items-center justify-center rounded-xl bg-background-dark/80 backdrop-blur border border-white/10 text-white shadow-xl">
<span class="material-symbols-outlined">remove</span>
</button>
</div>
<button class="flex size-11 items-center justify-center rounded-xl bg-primary text-background-dark shadow-xl">
<span class="material-symbols-outlined">near_me</span>
</button>
</div>
</div>
</div>
<!-- Stats Panel (Draggable/Bottom Sheet style) -->
<div class="glass-panel rounded-t-[2rem] p-4 pb-10 -mt-8 relative z-30 shadow-2xl">
<div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-6"></div>
<div class="flex items-center justify-between mb-4">
<h3 class="text-white text-xl font-bold tracking-tight px-1">Active Hub Performance</h3>
<span class="text-primary text-xs font-bold bg-primary/10 px-2 py-1 rounded">LIVE UPDATES</span>
</div>
<!-- Stats -->
<div class="flex overflow-x-auto gap-4 no-scrollbar pb-4">
<div class="flex min-w-[140px] flex-col gap-2 rounded-2xl p-4 bg-white/5 border border-white/10">
<p class="text-gray-400 text-xs font-medium">Total Riders</p>
<p class="text-white text-xl font-bold leading-tight">1,240</p>
<div class="flex items-center gap-1 text-[#0bda1d] text-[10px] font-bold">
<span class="material-symbols-outlined text-xs">trending_up</span>
<span>+12%</span>
</div>
</div>
<div class="flex min-w-[140px] flex-col gap-2 rounded-2xl p-4 bg-white/5 border border-white/10">
<p class="text-gray-400 text-xs font-medium">Active Orders</p>
<p class="text-white text-xl font-bold leading-tight">8,420</p>
<div class="flex items-center gap-1 text-[#0bda1d] text-[10px] font-bold">
<span class="material-symbols-outlined text-xs">trending_up</span>
<span>+5%</span>
</div>
</div>
<div class="flex min-w-[140px] flex-col gap-2 rounded-2xl p-4 bg-white/5 border border-white/10">
<p class="text-gray-400 text-xs font-medium">Hub Revenue</p>
<p class="text-white text-xl font-bold leading-tight">₦12.5M</p>
<div class="flex items-center gap-1 text-[#0bda1d] text-[10px] font-bold">
<span class="material-symbols-outlined text-xs">trending_up</span>
<span>+8.4%</span>
</div>
</div>
</div>
<!-- Territory Actions -->
<div class="grid grid-cols-2 gap-4 mt-2">
<button class="flex items-center justify-center gap-2 bg-primary text-background-dark py-4 rounded-2xl font-bold shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">zoom_out_map</span>
<span>Expand Hub</span>
</button>
<button class="flex items-center justify-center gap-2 bg-white/10 text-white py-4 rounded-2xl font-bold border border-white/10">
<span class="material-symbols-outlined">settings_ethernet</span>
<span>Adjust Radius</span>
</button>
</div>
<!-- Quick Radius Slider (Preview) -->
<div class="mt-6 px-2">
<div class="flex justify-between items-center mb-2">
<p class="text-xs font-medium text-gray-400 uppercase tracking-widest">Global Delivery Radius</p>
<p class="text-xs font-bold text-primary">15.5 KM</p>
</div>
<div class="relative w-full h-1.5 bg-white/10 rounded-full">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full w-2/3"></div>
<div class="absolute top-1/2 left-2/3 -translate-y-1/2 size-4 bg-white rounded-full border-2 border-primary shadow-lg"></div>
</div>
</div>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-6 bg-background-dark"></div>
</div>
</body></html>

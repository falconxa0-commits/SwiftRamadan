<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Iftar &amp; Delivery Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#ecb613",
                "background-light": "#f8f8f6",
                "background-dark": "#221d10",
                "ramadan-green": "#2d5a27",
              },
              fontFamily: {
                "display": ["Plus Jakarta Sans"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .gold-glow {
            box-shadow: 0 0 15px rgba(236, 182, 19, 0.2);
        }
        .green-glow {
            box-shadow: 0 0 10px rgba(45, 90, 39, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-start p-6 space-y-12">
<!-- Mock Screen Background (Simulating an iPhone Lock Screen) -->
<div class="fixed inset-0 -z-10 bg-cover bg-center opacity-40 grayscale" data-alt="Abstract dark Nigerian landscape at dusk" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAAnx1uFJZMpW2aep6FA85HqWkdU3-dwjw9eNU8Bu6fFbe-1MbPmHcMIKy55A61Tl-JzOD7CwHQCJw3eBUAUpI4vLdyaTstfkyyNFDz5GADDzZK9YYdLpABcfunyNfxxTTRxFSCgA5XsmkufWfgPYgjNf3TF7O1kLJYgmRfUuemxEM_S39RgQnfd-iyC-9FY3ZvHBqOm_R2uvlTbLj4AAw9e8Knou7UI2r4CeZwO3nRu08-AJMJ0qKd9DUCacKsQjjk2r5SOuHqS1IT');"></div>
<!-- 1. Dynamic Island (Expanded View) -->
<div class="w-full max-w-[360px] bg-black rounded-[40px] p-5 ios-blur border border-white/10 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="text-primary flex items-center justify-center" style="font-size: 28px;">
<span class="material-symbols-outlined fill-1">bedtime</span>
</div>
<div class="flex flex-col">
<span class="text-white text-xs opacity-60 font-medium">Iftar Countdown</span>
<span class="text-white text-xl font-bold tracking-tight">42:15</span>
</div>
</div>
<div class="flex items-center gap-3">
<div class="h-8 w-[1px] bg-white/10"></div>
<button class="bg-primary text-background-dark px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined !text-sm">call</span>
                Call Rider
            </button>
</div>
</div>
<!-- 2. Lock Screen Widget (Elegant Gold-Bordered Card) -->
<div class="w-full max-w-[360px] relative group">
<!-- Subtle Glow Background -->
<div class="absolute -inset-0.5 bg-gradient-to-r from-primary/50 to-primary/20 rounded-xl blur opacity-30 group-hover:opacity-50 transition duration-1000"></div>
<div class="relative bg-black/60 dark:bg-background-dark/80 backdrop-blur-xl border border-primary/30 rounded-xl p-5 shadow-2xl">
<!-- Header Section -->
<div class="flex justify-between items-start mb-4">
<div class="flex flex-col">
<h2 class="text-white text-xl font-bold leading-tight">Maghrib in 42 mins</h2>
<p class="text-primary/80 text-sm font-medium">Iftar Time: 6:48 PM</p>
</div>
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary">restaurant</span>
</div>
</div>
<!-- Maghrib Progress Bar (Green Glow) -->
<div class="flex flex-col gap-2 mb-6">
<div class="flex justify-between text-[10px] uppercase tracking-widest text-white/40 font-bold">
<span>Asr</span>
<span class="text-primary">Countdown</span>
<span>Maghrib</span>
</div>
<div class="h-2 w-full bg-white/5 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-ramadan-green to-primary rounded-full green-glow" style="width: 78%;"></div>
</div>
</div>
<!-- Delivery Tracker Section -->
<div class="bg-white/5 rounded-lg p-4 border border-white/5">
<div class="flex items-center justify-between mb-3">
<p class="text-white text-sm font-medium">Your Iftar Box is 8 mins away</p>
<span class="text-primary text-xs font-bold">Rider: Ibrahim</span>
</div>
<!-- Rider Track -->
<div class="relative h-6 flex items-center">
<!-- The Track Line -->
<div class="absolute w-full h-0.5 bg-white/10 rounded-full"></div>
<div class="absolute h-0.5 bg-primary/40 rounded-full" style="width: 80%;"></div>
<!-- Icons on Track -->
<div class="absolute left-0 text-white/30">
<span class="material-symbols-outlined !text-lg">storefront</span>
</div>
<!-- Moving Rider -->
<div class="absolute left-[75%] -translate-x-1/2 flex flex-col items-center">
<div class="bg-primary text-background-dark p-1 rounded-full gold-glow animate-pulse">
<span class="material-symbols-outlined !text-sm">moped</span>
</div>
</div>
<div class="absolute right-0 text-primary">
<span class="material-symbols-outlined !text-lg fill-1">home</span>
</div>
</div>
</div>
<!-- Footer Action -->
<div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-white/60 text-xs font-medium">Live Tracking Active</span>
</div>
<button class="text-primary text-xs font-bold flex items-center gap-1">
                    View Details
                    <span class="material-symbols-outlined !text-xs">chevron_right</span>
</button>
</div>
</div>
</div>
<!-- 3. Mini Notification/Compact Island Sim -->
<div class="w-24 h-8 bg-black rounded-full flex items-center justify-center gap-2 border border-white/10">
<span class="material-symbols-outlined text-primary !text-sm fill-1">bedtime</span>
<span class="text-white text-[10px] font-bold">42m</span>
</div>
<!-- Bottom Instructions (Not part of widget) -->
<div class="fixed bottom-8 text-center px-6">
<p class="text-white/40 text-xs font-medium uppercase tracking-[0.2em] mb-2">Ramadan 2026 Premium Experience</p>
<div class="h-1 w-12 bg-white/20 mx-auto rounded-full"></div>
</div>
</body></html>

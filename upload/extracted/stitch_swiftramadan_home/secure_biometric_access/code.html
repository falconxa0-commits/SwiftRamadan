<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Biometric Access - SwiftLogistics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>.glass-effect {
    background: rgba(16, 22, 34, 0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px)
    }
.scan-glow {
    box-shadow: 0 0 30px 2px rgba(43, 108, 238, 0.4)
    }
.ios-blur-bg {
    background-image: linear-gradient(rgba(16, 22, 34, 0.6), rgba(16, 22, 34, 0.9)), url(https://lh3.googleusercontent.com/aida-public/AB6AXuAtyNS_j8oZks2sMO_qGZoHb7WE7xEHOlPQAGS5lpJ-oKVc5canmfr91ZUWA5YMsArpbQl0FZae-gWy7tg3p0nXYTQN8R87dK8nbXe_wI8ueddu3lnrJJI3OlOSDwC3qc2e_OlXfXEVkMjdyoI_Kn5f2dABipL4EGvfPUkKZhCdMQ7njQfGdoE775wbpry5u3r-sQpzsMhqd-dlo2h_S_vsTYSxKCR7Or_QzpGukN-YeCOnieH3-o-ELhk4_FUd8CR3opXvLhx9XQTf);
    background-size: cover;
    background-position: center
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white overflow-hidden">
<!-- Background Layer (Blurred Mockup of App) -->
<div class="fixed inset-0 ios-blur-bg grayscale-[0.5]" data-alt="Blurred dashboard of a food delivery app with Nigerian dishes"></div>
<!-- Main Container -->
<div class="relative flex h-screen w-full flex-col justify-between overflow-hidden">
<!-- Top App Bar -->
<header class="flex items-center p-6 justify-between z-10">
<div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-white/10 backdrop-blur-md">
<span class="material-symbols-outlined text-white">chevron_left</span>
</div>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase tracking-[0.2em] text-primary font-bold">SwiftLogistics</span>
<h2 class="text-white text-sm font-semibold leading-tight">Secure Access</h2>
</div>
<div class="size-10 flex items-center justify-center rounded-full bg-white/10 backdrop-blur-md">
<span class="material-symbols-outlined text-white text-[20px]">help_outline</span>
</div>
</header>
<!-- Content Area -->
<main class="flex flex-1 flex-col items-center justify-center px-6 z-10">
<!-- Ramadan Context Badge -->
<div class="mb-8 flex items-center gap-2 px-4 py-2 rounded-full bg-primary/10 border border-primary/20 backdrop-blur-md">
<span class="material-symbols-outlined text-primary text-sm">bedtime</span>
<span class="text-xs font-medium text-primary">Ramadan Kareem, Ibrahim</span>
</div>
<!-- Headline -->
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight text-center mb-2">Welcome Back</h1>
<p class="text-white/60 text-base font-normal leading-normal text-center mb-12">Authenticate to access your premium Nigerian delicacies</p>
<!-- Biometric Interaction Zone -->
<div class="relative group cursor-pointer">
<!-- Outer Ring -->
<div class="flex size-48 items-center justify-center rounded-full border-2 border-primary/30 scan-glow relative">
<!-- Scanner Ring Interior -->
<div class="flex size-40 items-center justify-center rounded-full bg-primary/20 backdrop-blur-xl border border-primary/40">
<span class="material-symbols-outlined text-primary text-[64px]" style="font-variation-settings: 'wght' 200;">face</span>
</div>
<!-- Scanner Animation Elements (CSS Simulated) -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/60 shadow-[0_0_15px_rgba(43,108,238,1)] rounded-full animate-pulse"></div>
</div>
<!-- Status Text -->
<div class="mt-8">
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] text-center mb-1">Authenticating...</h2>
<p class="text-primary text-xs font-bold uppercase tracking-widest text-center">Ready to Scan</p>
</div>
</div>
</main>
<!-- Footer Actions -->
<footer class="flex flex-col gap-4 p-8 z-10">
<!-- Primary Fallback -->
<button class="flex h-14 w-full items-center justify-center gap-3 rounded-full bg-primary text-white font-bold shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">grid_view</span>
<span>Enter PIN Code</span>
</button>
<!-- Secondary Options -->
<div class="flex items-center justify-between px-2">
<button class="text-white/50 text-sm font-medium hover:text-white transition-colors">Forgot PIN?</button>
<div class="h-1 w-1 rounded-full bg-white/20"></div>
<button class="text-white/50 text-sm font-medium hover:text-white transition-colors">Use Password</button>
</div>
<!-- Signup Redirect -->
<div class="mt-4 text-center">
<p class="text-white/40 text-xs">Not your account? <span class="text-primary font-bold cursor-pointer">Switch Account</span></p>
</div>
<!-- iOS Home Indicator Spacing -->
<div class="h-2 w-32 bg-white/20 rounded-full mx-auto mt-6"></div>
</footer>
<!-- Glassmorphism Overlay to darken background -->
<div class="absolute inset-0 bg-background-dark/40 -z-10"></div>
</div>
<!-- Decorative Elements (2026 Futuristic Look) -->
<div class="fixed -top-24 -left-24 size-64 rounded-full bg-primary/20 blur-[100px]"></div>
<div class="fixed -bottom-24 -right-24 size-80 rounded-full bg-primary/10 blur-[120px]"></div>
</body></html>

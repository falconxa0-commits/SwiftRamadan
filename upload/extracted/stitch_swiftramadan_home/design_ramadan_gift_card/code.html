<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Design Ramadan Gift Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d452",
                        "gold": "#D4AF37",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen">
<!-- Top Navigation Bar -->
<div class="fixed top-0 left-0 right-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<div class="flex size-10 items-center justify-center rounded-full bg-black/5 dark:bg-white/10 cursor-pointer">
<span class="material-symbols-outlined text-xl">close</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">Ramadan Gift Card</h2>
<div class="flex size-10 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-gold">info</span>
</div>
</div>
</div>
<main class="pt-20 pb-32 max-w-md mx-auto px-4">
<!-- Section: Design Selection -->
<div class="mb-8">
<h3 class="text-xl font-bold tracking-tight mb-4">Choose a Design</h3>
<div class="flex overflow-x-auto no-scrollbar -mx-4 px-4 gap-4">
<!-- Card 1 -->
<div class="flex flex-col gap-3 min-w-[260px] group">
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden border-2 border-primary shadow-lg shadow-primary/20">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Dark green background with gold crescent moon and lanterns" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAOF8QzC2r9_bwlfPkKpdb26oXJnTkrfcMmXNCkwK5I7Go6G7OBsSm1tzy1qvNq3OjFCTHyGFbXqPsudw7PN6ngzlx3rSDwlidBgoUe_re_LiRpq0moZldMvm7J2RaVwunvMOwGWvXMFI2OQvbE805DsEDbt0nll8oFsmCKnGC_1LEj09AkMUZaLZ8Pklz_dtRKdwmGSuIvvT4cR3dhTcVS3vVaxpb9sC94wk1Lz0tHnkOUESaI9J6R9iNtnZAqkMS6mwT32PxQa3HB");'></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<div class="absolute bottom-4 left-4">
<span class="bg-gold text-black text-[10px] font-black px-2 py-0.5 rounded-full uppercase">Premium</span>
</div>
</div>
<div>
<p class="text-base font-bold">Crescent &amp; Lanterns</p>
<p class="text-slate-500 dark:text-primary/70 text-sm">Elegant &amp; Traditional</p>
</div>
</div>
<!-- Card 2 -->
<div class="flex flex-col gap-3 min-w-[260px] opacity-60">
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden border border-slate-200 dark:border-white/10">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Minimalist geometric islamic pattern in emerald and gold" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuApcXdEPM9z_eBkGEy5fB_eDbv2-0EGg_iAv1NUZmt2hIv-cn6WHEYG4Uu9YKcFNeVBh2r5AJVcU3DHQYIhhxKxK6-KuNWkKWBJUYZ8edvYWPumr7ueGPXV52DlRor1bp8p5Plvqc1r91aZRQo-JwRgDFGdPtDWSQh0jfCJZ4gKll015-y0_81Y_dgW1TBhq0Q2zBJPa4kAVK-NtT_hNO_JrfFV8cQQZjRqrQBRsuObBU3ZxCM2a89t4Vnzc_LNOzsf3svtkI7OWaSA");'></div>
<div class="absolute inset-0 bg-black/10"></div>
</div>
<div>
<p class="text-base font-bold">Modern Geometric</p>
<p class="text-slate-500 dark:text-primary/70 text-sm">Minimalist &amp; Bold</p>
</div>
</div>
<!-- Card 3 -->
<div class="flex flex-col gap-3 min-w-[260px] opacity-60">
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden border border-slate-200 dark:border-white/10">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Soft floral motifs with Arabic calligraphy greetings" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD6T_dfW1Enu9CMRiIWwHNigptXLh9eololGkticIQbxDayELs2xdB0cKdVkWCbsWgi51yCcRWud-SiMaYB2R_2anM7miRD2cfxbvDYpHTN9d_h0Ev2J49a8VjgYPpIBZGa8B-44ldgtJvZx7fS2hUGOCT0LNsvyRwdvqM6v5eM5gGAimtKjPwl5S8lx4MFjOpL46FKP01yB2W_IGCqEPZH1eX9VWHBQTzBDn2rPsOsTS-bfFQlch0hsNe4edi_C-aEch7IgDuFC2mA");'></div>
</div>
<div>
<p class="text-base font-bold">Floral Ramadan</p>
<p class="text-slate-500 dark:text-primary/70 text-sm">Soft &amp; Natural</p>
</div>
</div>
</div>
</div>
<!-- Section: Select Amount -->
<div class="mb-8">
<div class="flex justify-between items-end mb-4">
<h3 class="text-xl font-bold tracking-tight">Select Amount</h3>
<span class="text-primary font-bold text-2xl tracking-tighter">₦10,000</span>
</div>
<div class="bg-slate-100 dark:bg-white/5 p-6 rounded-xl border border-slate-200 dark:border-white/10">
<div class="relative flex w-full flex-col items-center gap-6">
<div class="flex w-full items-center gap-4 h-8">
<div class="flex h-2 flex-1 rounded-full bg-slate-300 dark:bg-white/10 relative">
<div class="absolute top-0 left-0 h-full w-[40%] rounded-full bg-primary shadow-[0_0_12px_rgba(17,212,82,0.4)]"></div>
<div class="absolute left-[40%] top-1/2 -translate-y-1/2 -translate-x-1/2 size-6 rounded-full bg-white dark:bg-primary border-4 border-primary dark:border-background-dark shadow-lg"></div>
</div>
</div>
<div class="flex w-full justify-between px-1">
<button class="px-4 py-2 rounded-lg bg-white dark:bg-white/10 text-sm font-bold border border-slate-200 dark:border-white/10">₦5,000</button>
<button class="px-4 py-2 rounded-lg bg-primary text-background-dark text-sm font-bold border border-primary">₦10,000</button>
<button class="px-4 py-2 rounded-lg bg-white dark:bg-white/10 text-sm font-bold border border-slate-200 dark:border-white/10">₦25,000</button>
</div>
<div class="w-full h-[1px] bg-slate-200 dark:bg-white/10 my-2"></div>
<div class="w-full">
<label class="text-xs uppercase tracking-widest font-bold text-slate-500 dark:text-white/40 mb-2 block">Or Enter Custom Amount</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg font-bold text-slate-400">₦</span>
<input class="w-full bg-transparent border border-slate-300 dark:border-white/10 rounded-lg py-3 pl-10 pr-4 text-lg font-bold focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="0.00" type="number"/>
</div>
</div>
</div>
</div>
</div>
<!-- Section: Personalization -->
<div class="mb-8 flex flex-col gap-4">
<h3 class="text-xl font-bold tracking-tight">Personalize Message</h3>
<div class="space-y-4">
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-bold text-slate-500 dark:text-white/50 px-1">To</label>
<input class="w-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-lg py-3 px-4 focus:border-primary focus:ring-0 outline-none" placeholder="Recipient Name" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-bold text-slate-500 dark:text-white/50 px-1">From</label>
<input class="w-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-lg py-3 px-4 focus:border-primary focus:ring-0 outline-none" placeholder="Your Name" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-bold text-slate-500 dark:text-white/50 px-1">Message</label>
<textarea class="w-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-lg py-3 px-4 focus:border-primary focus:ring-0 outline-none resize-none" placeholder="Wishing you a blessed Ramadan full of joy and peace..." rows="3"></textarea>
<p class="text-[10px] text-right text-slate-400">0 / 150 characters</p>
</div>
</div>
</div>
<!-- Section: Delivery Method -->
<div class="mb-4">
<h3 class="text-xl font-bold tracking-tight mb-4">Send Via</h3>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 p-4 rounded-xl border-2 border-primary bg-primary/10 transition-all">
<span class="material-symbols-outlined text-primary">chat</span>
<span class="font-bold">WhatsApp</span>
</button>
<button class="flex items-center justify-center gap-3 p-4 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-100 dark:bg-white/5 transition-all opacity-60">
<span class="material-symbols-outlined">mail</span>
<span class="font-bold">Email</span>
</button>
</div>
</div>
</main>
<!-- Fixed Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-gradient-to-t from-background-light dark:from-background-dark via-background-light dark:via-background-dark to-transparent z-50">
<div class="max-w-md mx-auto">
<div class="flex items-center justify-between mb-4 px-2">
<div class="flex flex-col">
<span class="text-xs text-slate-500 dark:text-white/50 font-medium">Total to Pay</span>
<span class="text-xl font-extrabold text-primary">₦10,000.00</span>
</div>
<div class="text-right">
<span class="text-[10px] bg-gold/20 text-gold border border-gold/30 px-2 py-0.5 rounded font-bold uppercase">10% Off Logistics</span>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-black py-4 rounded-xl flex items-center justify-center gap-3 shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform">
<span>Purchase &amp; Send Gift</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Design Your Gift Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d452",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "gold": "#D4AF37"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        .custom-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-selected {
            border: 2px solid #11d452;
            box-shadow: 0 0 15px rgba(17, 212, 82, 0.3);
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center p-4 pb-2 justify-between">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/10">
<span class="material-symbols-outlined text-white">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center">
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Design Your Ramadan Gift</h2>
<p class="text-primary text-xs font-medium uppercase tracking-widest">Premium Collection</p>
</div>
<div class="flex w-10 items-center justify-end">
<p class="text-primary text-xs font-bold leading-normal shrink-0">1/3</p>
</div>
</div>
<!-- Progress Bar -->
<div class="px-4 py-2">
<div class="w-full bg-white/10 h-1 rounded-full overflow-hidden">
<div class="bg-primary h-full w-1/3"></div>
</div>
</div>
</header>
<main class="flex-1 overflow-y-auto pb-32">
<!-- HeadlineText -->
<div class="px-4 pt-6">
<h3 class="text-white tracking-tight text-3xl font-bold leading-tight">Choose a Theme</h3>
<p class="text-slate-400 text-sm mt-1">Select an artistic design for your digital gift card.</p>
</div>
<!-- ImageGrid (Vertical Scroll Layout) -->
<div class="flex flex-col gap-6 p-4">
<!-- Theme 1: Selected -->
<div class="relative group cursor-pointer">
<div class="bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-6 aspect-[16/9] card-selected" data-alt="Artistic crescent moon with gold Islamic patterns" style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 60%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuBj_6KV6KMrtjNdqODMlZ4jQWnCwGVxr65QSGl84yknUwm2FK7ijFypTSxWZenH6cyhLmNlbxSvfub9mBM0sfD45_1guy1gnOmJMujEpEPkejzlcjSiKYHrrKGpwEsN1VPhJE3Ypo4eAaLSD8l4PuOC9fE1GlihIev-Md_fnM29-cebCNnlrDQSb06Dhi2r6FYUTY7vYoI4VcQDVEOzo-XXFGPYHL7VoF1pK4soj4eY8bLL2FWg6TsGT5K4rG9LbuKs-LXtPED0I9Xb");'>
<div>
<p class="text-white text-xl font-bold leading-tight">The Crescent Grace</p>
<p class="text-primary text-sm font-medium">Classic Elegance</p>
</div>
</div>
<div class="absolute top-4 right-4 bg-primary text-background-dark rounded-full p-1 shadow-lg">
<span class="material-symbols-outlined text-sm font-bold">check</span>
</div>
</div>
<!-- Theme 2 -->
<div class="relative group cursor-pointer">
<div class="bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-6 aspect-[16/9] border border-white/10" data-alt="Silhouette of Abuja National Mosque at dusk" style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 60%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuBIojNToO9dkCYRTwZqXFCPQV7Jq5OsRqis_wOUCLGkQeHI076OxOAfMDbTZRM95mbVrKkpJWuraP8oCsxSZ5y7LlTn12zyLFCvOLvvoAF9IQbOoz8j3JkU0LnaNU4GBYHLU_HsVPMnr-qDHSKqjxgHGfSWOOR_Ky6kyBGGuiR2VOsDOK9onaHaMlItmOMuJVTxwrouIxkqbtw7nBFzwud-gi1QoSjSsgAnrcATTS3DyhCgq0HQ5y3hmn3nZH82Q9fWaeTM2s-O6c0S");'>
<div>
<p class="text-white text-xl font-bold leading-tight">Midnight over Abuja</p>
<p class="text-slate-300 text-sm font-medium">Urban Serenity</p>
</div>
</div>
</div>
<!-- Theme 3 -->
<div class="relative group cursor-pointer">
<div class="bg-cover bg-center flex flex-col gap-3 rounded-xl justify-end p-6 aspect-[16/9] border border-white/10" data-alt="Traditional ornate hanging lanterns with warm light" style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 60%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuC3ZxvpodFWJRo57finE8MAk3uZwWlHM6KciWdttbKnyBG4yKwysosIAA_ES2u147JjLO_KwbEh1TGKxZgBaXxWEeCYdmTav51-_nLpPoVl7vIKusLhmYZGTE7kB2CetfXh9aBkF95Nz7oTyYfnZD_BdfiHDbBHYKmtCdEWRZO1z8rFRamMgOF7sOVeXezj3DJNe88qmOR3moajbl-1_7w-NZM-GFwbIFNi19IMKwDImbHGbikOa38Zb645gDd2ZZQdAInawh1YxV3-");'>
<div>
<p class="text-white text-xl font-bold leading-tight">Traditional Lanterns</p>
<p class="text-slate-300 text-sm font-medium">Heritage Glow</p>
</div>
</div>
</div>
</div>
<!-- SectionHeader -->
<div class="px-4 pt-4">
<h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Select Value</h3>
<p class="text-slate-400 text-xs mt-1 italic text-gold">Share the blessings with a custom amount</p>
</div>
<!-- SegmentedButtons (Value Selector) -->
<div class="flex px-4 py-4">
<div class="grid grid-cols-2 gap-3 w-full">
<label class="flex cursor-pointer h-14 items-center justify-center rounded-xl bg-white/5 border border-white/10 has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-all">
<input class="hidden" name="amount" type="radio" value="10000"/>
<span class="text-white font-bold">₦10,000</span>
</label>
<label class="flex cursor-pointer h-14 items-center justify-center rounded-xl bg-white/5 border border-white/10 has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-all">
<input checked="" class="hidden" name="amount" type="radio" value="25000"/>
<span class="text-white font-bold">₦25,000</span>
</label>
<label class="flex cursor-pointer h-14 items-center justify-center rounded-xl bg-white/5 border border-white/10 has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-all">
<input class="hidden" name="amount" type="radio" value="50000"/>
<span class="text-white font-bold">₦50,000</span>
</label>
<label class="flex cursor-pointer h-14 items-center justify-center rounded-xl bg-white/5 border border-white/10 has-[:checked]:border-primary has-[:checked]:bg-primary/10 transition-all">
<input class="hidden" name="amount" type="radio" value="100000"/>
<span class="text-white font-bold">₦100,000</span>
</label>
</div>
</div>
<!-- Custom Input -->
<div class="px-4 pb-10">
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-bold">₦</span>
<input class="w-full bg-white/5 border border-white/10 rounded-xl py-4 pl-10 pr-4 text-white placeholder-slate-500 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Enter custom amount" type="number"/>
</div>
</div>
</main>
<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-dark/90 backdrop-blur-xl border-t border-white/5">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span>Next Step</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<div class="h-4"></div> <!-- Home Indicator Space -->
</div>
</body></html>

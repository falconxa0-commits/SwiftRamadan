<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Set Delivery Location - Premium Nigerian Logistics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2b90d",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221e10",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }
        .map-container {
            height: 100vh;
            width: 100%;
        }
        .bottom-sheet {
            box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .custom-blur {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<!-- Main Container (Mobile Viewport) -->
<div class="relative flex flex-col h-screen w-full max-w-[430px] mx-auto overflow-hidden bg-background-dark">
<!-- Status Bar Space (iOS) -->
<div class="h-12 w-full absolute top-0 z-50 pointer-events-none"></div>
<!-- Full Screen Map Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-80 grayscale contrast-125" data-alt="Dark stylized city map of Lagos Nigeria with streets" data-location="Lagos, Nigeria" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwvxX5WXFk6qWinZFdGwl8NRmfFJeE35Zs8WhoCuzShuG8Tv-85Olx0xofroKEHSACeHdDe-KFJZuSF6tSyQPMBJ-ON5HNaRn3LXuDmi3230nMrD0lL4Iu0OFgRIxs-bmvA6Iy7V0rBxKN2sNImQVYAFUehF9h-DnxfEEQGuAz7QoexrfIX9ZAieAEPpwVKu7b-H7AS-Gahy2txJHlgLsPfb950RmUhpj5tc4mVVg4T_ZkNIwJnHYg6FCDMpOEpjmNZTEZXr_v_ufp"/>
<div class="absolute inset-0 bg-gradient-to-b from-background-dark/40 via-transparent to-background-dark/20 pointer-events-none"></div>
</div>
<!-- Draggable Pin Placeholder (Center of Map) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 -mt-10">
<div class="flex flex-col items-center">
<!-- Tooltip Label -->
<div class="bg-background-dark/90 text-white text-[10px] px-2 py-1 rounded-full mb-1 border border-primary/30 uppercase tracking-widest font-bold">
                    Delivery Point
                </div>
<!-- Pin Body -->
<div class="relative">
<span class="material-icons-round text-primary text-6xl drop-shadow-2xl">location_on</span>
<!-- Pulse Effect -->
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-4 h-1 bg-black/40 rounded-full blur-[2px]"></div>
</div>
</div>
</div>
<!-- Top Search UI -->
<div class="relative z-20 px-4 pt-14 pointer-events-auto">
<div class="flex flex-col gap-3">
<!-- Search Bar Container -->
<div class="relative flex items-center bg-background-dark/80 custom-blur border border-white/10 rounded-xl p-3 shadow-lg group focus-within:border-primary/50 transition-all">
<span class="material-icons-round text-primary mr-3">search</span>
<input class="bg-transparent border-none focus:ring-0 text-white w-full placeholder:text-slate-500 text-sm py-0" placeholder="Search address in Nigeria..." type="text" value="12 Admiralty Way, Lekki Phase 1"/>
<span class="material-icons-round text-slate-500 text-xl cursor-pointer">cancel</span>
</div>
<!-- Suggested Addresses (Auto-complete) -->
<div class="bg-background-dark/95 custom-blur rounded-xl border border-white/5 overflow-hidden shadow-2xl">
<div class="flex items-center gap-3 p-3 border-b border-white/5 hover:bg-white/5 cursor-pointer">
<span class="material-icons-round text-slate-400 text-sm">history</span>
<div class="flex-1">
<p class="text-xs font-medium text-white">12 Admiralty Way</p>
<p class="text-[10px] text-slate-500">Lekki Phase 1, Lagos</p>
</div>
</div>
</div>
</div>
</div>
<!-- Floating Action Buttons -->
<div class="absolute right-4 bottom-[380px] z-20 flex flex-col gap-3">
<button class="w-12 h-12 rounded-xl bg-background-dark/80 custom-blur border border-white/10 flex items-center justify-center text-primary shadow-lg hover:bg-background-dark transition-colors">
<span class="material-icons-round">my_location</span>
</button>
</div>
<!-- Ramadan Badge (Seasonal Context) -->
<div class="absolute left-4 bottom-[385px] z-20">
<div class="bg-primary/20 backdrop-blur-md border border-primary/40 rounded-full px-3 py-1.5 flex items-center gap-2">
<span class="material-icons-round text-primary text-sm">dark_mode</span>
<span class="text-[10px] font-bold text-primary uppercase tracking-tighter">Deliver before Iftar</span>
</div>
</div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 left-0 right-0 z-30 bg-background-dark border-t border-white/10 rounded-t-3xl bottom-sheet">
<!-- Grab Handle -->
<div class="flex justify-center py-3">
<div class="w-10 h-1 bg-slate-700 rounded-full"></div>
</div>
<div class="px-6 pb-8 space-y-6">
<!-- Address Summary -->
<div class="flex items-start gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-icons-round text-primary">place</span>
</div>
<div>
<h2 class="text-white font-bold text-lg leading-tight">12 Admiralty Way</h2>
<p class="text-slate-400 text-sm">Lekki Phase 1, Lagos, Nigeria</p>
</div>
</div>
<!-- Detailed Inputs -->
<div class="space-y-4">
<div class="grid grid-cols-1 gap-4">
<!-- Apartment/Suite -->
<div class="space-y-1.5">
<label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest pl-1">Apartment / Suite</label>
<div class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 flex items-center focus-within:border-primary/50 transition-colors">
<span class="material-icons-round text-slate-500 text-lg mr-3">apartment</span>
<input class="bg-transparent border-none focus:ring-0 text-white text-sm w-full p-0 placeholder:text-slate-600" placeholder="e.g. Flat 4B or Suite 12" type="text"/>
</div>
</div>
<!-- Delivery Instructions -->
<div class="space-y-1.5">
<label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest pl-1">Delivery Instructions</label>
<div class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 flex items-start focus-within:border-primary/50 transition-colors">
<span class="material-icons-round text-slate-500 text-lg mr-3 mt-0.5">sticky_note_2</span>
<textarea class="bg-transparent border-none focus:ring-0 text-white text-sm w-full p-0 placeholder:text-slate-600 resize-none" placeholder="e.g. Call at the gate, building with the yellow door..." rows="2"></textarea>
</div>
</div>
</div>
</div>
<!-- Shortcuts (Nigerian Context Landmarks) -->
<div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
<button class="shrink-0 px-4 py-2 rounded-full border border-white/10 text-xs font-medium text-slate-300 hover:bg-white/5 transition-colors flex items-center gap-1.5">
<span class="material-icons-round text-sm">home</span> Home
                    </button>
<button class="shrink-0 px-4 py-2 rounded-full border border-white/10 text-xs font-medium text-slate-300 hover:bg-white/5 transition-colors flex items-center gap-1.5">
<span class="material-icons-round text-sm">work</span> Office
                    </button>
<button class="shrink-0 px-4 py-2 rounded-full border border-white/10 text-xs font-medium text-slate-300 hover:bg-white/5 transition-colors flex items-center gap-1.5">
<span class="material-icons-round text-sm">favorite</span> Partner's House
                    </button>
</div>
<!-- Confirm Action -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span>CONFIRM LOCATION</span>
<span class="material-icons-round text-xl">arrow_forward</span>
</button>
</div>
<!-- Safe Area Spacer -->
<div class="h-8"></div>
</div>
</div>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</body></html>
